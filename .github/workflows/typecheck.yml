name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Skip native rebuilds (better-sqlite3 for Electron) — tsc doesn't need them
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
